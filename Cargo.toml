[package]
name = "bolt-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Windows process sandbox for Bolt Agent"

[lib]
name = "bolt_sandbox"
path = "src/lib.rs"

[dependencies]
getrandom = "=0.4.3"
idna = "=1.1.0"
sha2 = "=0.11.0"
winapi-util = "=0.1.11"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
