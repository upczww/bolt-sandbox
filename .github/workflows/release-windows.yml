name: Signed Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version used in the package directory
        required: true
        type: string
      timestamp_url:
        description: HTTPS RFC3161 timestamp service
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate release inputs
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TIMESTAMP_URL: ${{ inputs.timestamp_url }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$') {
            throw 'Release version contains unsupported characters.'
          }
          $timestamp = $null
          if (-not [Uri]::TryCreate($env:TIMESTAMP_URL, [UriKind]::Absolute, [ref]$timestamp) -or
              $timestamp.Scheme -ne 'https') {
            throw 'Timestamp URL must be an absolute HTTPS URI.'
          }

      - name: Verify source and build components
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
          pwsh scripts/verify-test-traceability.ps1
          pwsh scripts/test-third-party.ps1
          pwsh scripts/build-windows.ps1 -Configuration Release -Architecture All
          & target/native/x64/Release/bolt-sandbox-native-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/native/x86/Release/bolt-sandbox-native-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --bin bolt-sandbox

      - name: Import signing certificate
        id: certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD) {
            throw 'Windows signing secrets are not configured.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'bolt-signing.pfx'
          [IO.File]::WriteAllBytes(
            $pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          try {
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD `
              -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My -Password $password `
              -Exportable:$false
            if (-not $certificate -or -not $certificate.HasPrivateKey) {
              throw 'Imported certificate has no private key.'
            }
            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Sign final component bytes
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
          TIMESTAMP_URL: ${{ inputs.timestamp_url }}
        run: |
          $signtool = Get-ChildItem `
            'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' `
            | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found.' }
          $files = @(
            'target\release\bolt-sandbox.exe',
            'target\native\x64\Release\bolt-sandbox-launcher.exe',
            'target\native\x86\Release\bolt-sandbox-launcher-x86.exe',
            'target\native\x64\Release\bolt-sandbox-x64.dll',
            'target\native\x86\Release\bolt-sandbox-x86.dll'
          )
          foreach ($file in $files) {
            & $signtool.FullName sign /sha1 $env:CERTIFICATE_THUMBPRINT `
              /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package signed components
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          pwsh scripts/package-windows.ps1 -Version $env:RELEASE_VERSION `
            -SkipBuildCli -RequireSigned

      - name: Upload signed package
        uses: actions/upload-artifact@v7
        with:
          name: bolt-sandbox-windows-${{ inputs.version }}
          path: target/packages/bolt-sandbox-${{ inputs.version }}-windows-x64
          if-no-files-found: error

      - name: Remove imported certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          Remove-Item -LiteralPath `
            "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT" `
            -Force -ErrorAction SilentlyContinue
